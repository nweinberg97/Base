name: Fetch photo candidates

# Downloads openly licensed candidate photos from Wikimedia Commons into the
# photo-candidates branch for review. Run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Space-separated slugs (empty = all)'
        required: false
        default: ''
      set:
        description: 'main or prep'
        required: false
        default: 'main'
      per_slug:
        description: 'Candidates per item'
        required: false
        default: '6'
  push:
    branches: [photo-candidates-request]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: node scripts/photos/candidates.ts ${{ github.event.inputs.slugs }}
        env:
          PER_SLUG: ${{ github.event.inputs.per_slug || '6' }}
          PHOTO_SET: ${{ github.event.inputs.set || 'main' }}
      - name: Commit candidates to the photo-candidates branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -B photo-candidates
          git add -f photo-candidates
          git commit -m "Photo candidates from Wikimedia Commons" || echo "nothing to commit"
          git push -f origin photo-candidates
